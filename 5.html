
<!DOCTYPE html>
<html>
<head>
    <title>Snake and Ladder Game</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #234567;
        }

        .game {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #ccc;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            border: 3px solid #234567;
            margin: 20px auto;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border: 1px solid #aaa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            position: relative;
            padding: 2px;
        }

        .even {
            background: #d9f2e6;
        }

        .odd {
            background: #fff2cc;
        }

        .snake {
            background: #ffcccc !important;
        }

        .ladder {
            background: #cce5ff !important;
        }

        .special {
            font-size: 10px;
            margin-top: 3px;
        }

        .players {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px;
            flex-wrap: wrap;
        }

        .player {
            padding: 10px 15px;
            border-radius: 8px;
            background: #eee;
        }

        .active {
            background: #bde0fe;
            border: 2px solid #0077b6;
        }

        .token {
            font-size: 16px;
            margin-top: 2px;
        }

        #dice {
            font-size: 50px;
            margin: 10px;
        }

        button {
            padding: 12px 22px;
            background: #234567;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #3674a8;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #message {
            font-size: 18px;
            font-weight: bold;
            color: #234567;
            margin: 15px;
            min-height: 25px;
        }

        @media(max-width: 500px) {
            body {
                padding: 5px;
            }

            .game {
                padding: 8px;
            }

            .cell {
                font-size: 10px;
            }

            .special {
                font-size: 7px;
            }

            .token {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<h1>🐍 Snake and Ladder 🎲</h1>

<div class="game">

    <div class="players">
        <div class="player active" id="p1">
            🔴 Player 1: <span id="pos1">0</span>
        </div>

        <div class="player" id="p2">
            🔵 Player 2: <span id="pos2">0</span>
        </div>
    </div>

    <div id="dice">🎲</div>

    <button onclick="rollDice()" id="rollBtn">Roll Dice</button>
    <button onclick="restartGame()">Restart Game</button>

    <div id="message">Player 1's turn. Roll the dice!</div>

    <div id="board"></div>

</div>

<script>
    const board = document.getElementById("board");

    // Snakes: player moves down
    const snakes = {
        99: 54,
        70: 55,
        52: 42,
        25: 2,
        95: 72,
        89: 68,
        64: 60,
        38: 20
    };

    // Ladders: player moves up
    const ladders = {
        6: 25,
        11: 40,
        17: 69,
        46: 90,
        47: 76,
        62: 81,
        72: 93,
        29: 51
    };

    let positions = [0, 0];
    let currentPlayer = 0;
    let gameOver = false;

    // Create board in snake pattern
    function createBoard() {
        board.innerHTML = "";

        for (let row = 9; row >= 0; row--) {
            for (let col = 0; col < 10; col++) {

                let number;

                if (row % 2 === 0) {
                    number = row * 10 + col + 1;
                } else {
                    number = row * 10 + (10 - col);
                }

                const cell = document.createElement("div");
                cell.className = "cell " +
                    (number % 2 === 0 ? "even" : "odd");

                cell.id = "cell" + number;

                const num = document.createElement("span");
                num.textContent = number;
                cell.appendChild(num);

                if (snakes[number]) {
                    cell.classList.add("snake");
                    const info = document.createElement("span");
                    info.className = "special";
                    info.textContent = "🐍 ↓ " + snakes[number];
                    cell.appendChild(info);
                }

                if (ladders[number]) {
                    cell.classList.add("ladder");
                    const info = document.createElement("span");
                    info.className = "special";
                    info.textContent = "🪜 ↑ " + ladders[number];
                    cell.appendChild(info);
                }

                board.appendChild(cell);
            }
        }

        updateTokens();
    }

    // Display players on board
    function updateTokens() {
        document.querySelectorAll(".token").forEach(token => token.remove());

        positions.forEach((position, player) => {
            if (position > 0) {
                const cell = document.getElementById("cell" + position);

                if (cell) {
                    const token = document.createElement("div");
                    token.className = "token";
                    token.textContent = player === 0 ? "🔴" : "🔵";
                    cell.appendChild(token);
                }
            }
        });

        document.getElementById("pos1").textContent = positions[0];
        document.getElementById("pos2").textContent = positions[1];
    }

    // Roll dice and move player
    function rollDice() {
        if (gameOver) return;

        const dice = Math.floor(Math.random() * 6) + 1;
        document.getElementById("dice").textContent = "🎲 " + dice;

        let oldPosition = positions[currentPlayer];
        let newPosition = oldPosition + dice;

        if (newPosition > 100) {
            document.getElementById("message").textContent =
                "Player " + (currentPlayer + 1) +
                " rolled " + dice + ". Need exact number to reach 100!";
            switchPlayer();
            return;
        }

        positions[currentPlayer] = newPosition;

        let message = "Player " + (currentPlayer + 1) +
            " rolled " + dice + " and moved to " + newPosition + ".";

        // Check ladder
        if (ladders[newPosition]) {
            positions[currentPlayer] = ladders[newPosition];
            message += " 🪜 Ladder! Climbed to " + ladders[newPosition] + ".";
        }

        // Check snake
        if (snakes[newPosition]) {
            positions[currentPlayer] = snakes[newPosition];
            message += " 🐍 Snake! Slid down to " + snakes[newPosition] + ".";
        }

        updateTokens();

        // Check winner
        if (positions[currentPlayer] === 100) {
            message = "🎉 Player " + (currentPlayer + 1) + " wins the game!";
            gameOver = true;
            document.getElementById("rollBtn").disabled = true;
        } else {
            switchPlayer();
        }

        document.getElementById("message").textContent = message;
    }

    // Change turn
    function switchPlayer() {
        currentPlayer = currentPlayer === 0 ? 1 : 0;

        document.getElementById("p1").classList.toggle("active",
            currentPlayer === 0);

        document.getElementById("p2").classList.toggle("active",
            currentPlayer === 1);
    }

    // Restart game
    function restartGame() {
        positions = [0, 0];
        currentPlayer = 0;
        gameOver = false;

        document.getElementById("dice").textContent = "🎲";
        document.getElementById("message").textContent =
            "Player 1's turn. Roll the dice!";

        document.getElementById("rollBtn").disabled = false;

        document.getElementById("p1").classList.add("active");
        document.getElementById("p2").classList.remove("active");

        createBoard();
    }

    createBoard();
</script>

</body>
</html>

<html>
<head>
<style>
  .circle {
    border-radius: 50%;
    position: absolute;
  }

  .circle1 {
    width: 60px;
    height: 60px;
    background-color: red;
    top: 0;
    left: 0;
  }

  .circle2 {
    width: 40px;
    height: 40px;
    background-color: yellow;
    top: 10px;
    left: 10px;
  }

  .circle3 {
    width: 20px;
    height: 20px;
    background-color: blue;
    top: 20px;
    left: 20px;
  }
</style>
</head>
<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

</body>
</html>

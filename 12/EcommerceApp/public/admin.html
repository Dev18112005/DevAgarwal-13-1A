<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Panel — ShopEase</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/">ShopEase<span>.</span></a><nav><a href="/">Store</a><a href="/orders.html">My Orders</a></nav><div class="user-actions"><span id="userLabel">Seller</span><button id="authBtn" class="btn small">Login</button></div></header><main class="container"><p class="eyebrow">SELLER CONSOLE</p><h1>Product management</h1><div class="admin-layout"><form id="productForm" class="panel"><h2 id="formTitle">Add a product</h2><input type="hidden" id="productId"><label>Product name<input id="pName" required></label><label>Description<textarea id="pDescription" rows="3"></textarea></label><label>Price (₹)<input id="pPrice" type="number" min="0" step="0.01" required></label><label>Category<input id="pCategory" placeholder="Electronics, Fashion..." required></label><label>Image URL<input id="pImage" placeholder="https://..."></label><label>Stock<input id="pStock" type="number" min="0" required></label><div class="form-actions"><button class="btn" type="submit">Save product</button><button class="btn secondary" type="button" id="resetForm">Clear</button></div></form><section><h2>Products</h2><div id="adminProducts"></div></section></div><h2 class="section-title">Recent orders</h2><div id="adminOrders"></div></main><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
